# DeepRhetor user configuration example.
# Copy to your user config location (never commit real credentials):
#   Linux/macOS: ~/.config/deeprhetor/config.toml
#   Windows:     %APPDATA%/deeprhetor/config.toml
#
# Environment overrides (optional):
#   DEEPRHETOR_OPENROUTER_API_KEY, DEEPRHETOR_TAVILY_API_KEY

[providers.openrouter]
api_key = "YOUR_OPENROUTER_API_KEY"
base_url = "https://openrouter.ai/api/v1"

[providers.tavily]
api_key = "YOUR_TAVILY_API_KEY"

[models.presets.cheap]
provider = "openrouter"
model = "openai/gpt-4o-mini"
temperature = 0.2

[models.presets.mid]
provider = "openrouter"
model = "openai/gpt-4o"
temperature = 0.2

[models.presets.frontier]
provider = "openrouter"
model = "anthropic/claude-sonnet-4"
temperature = 0.4

[limits]
max_search_results_per_assignment = 25
max_follow_up_searches = 5
max_model_retries = 3
max_tool_retries = 3
max_critic_passes = 5
max_document_bytes = 52_428_800
max_project_bytes = 1_073_741_824
fetch_timeout_seconds = 60
model_timeout_seconds = 300
provider_concurrency = 4
max_run_duration_seconds = 7_200
